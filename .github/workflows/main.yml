name: Deploy SSH Test

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy key secret
        env:
          DEPLOY_KEY: ${{ secrets.LIFEOS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "LIFEOS_DEPLOY_KEY is empty"
            exit 1
          fi
          echo "LIFEOS_DEPLOY_KEY is present"

      - name: Validate deploy key
        env:
          DEPLOY_KEY: ${{ secrets.LIFEOS_DEPLOY_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_KEY" > deploy_key
          chmod 600 deploy_key
          ssh-keygen -y -f deploy_key > /tmp/deploy_key.pub
          echo "Private key parsed successfully"
          ssh-keygen -lf /tmp/deploy_key.pub
          rm -f deploy_key /tmp/deploy_key.pub

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.LIFEOS_DEPLOY_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.LIFEOS_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.LIFEOS_DEPLOY_HOST }}
        run: |
          ssh -o BatchMode=yes \
              -o ConnectTimeout=10 \
              "lifeos@${DEPLOY_HOST}" \
              'echo DEPLOY_SSH_OK; whoami; hostname; pwd'
