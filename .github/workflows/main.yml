name: Deploy Life OS Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/pavankumar-vh/life-os-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.LIFEOS_DEPLOY_KEY }}

      - name: Add VPS host key
        env:
          DEPLOY_HOST: ${{ secrets.LIFEOS_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Oracle VPS
        env:
          DEPLOY_HOST: ${{ secrets.LIFEOS_DEPLOY_HOST }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
        run: |
          echo "Pulling image on VPS..."
          ssh "lifeos@$DEPLOY_HOST" \
            "sudo docker pull '$IMAGE'"

          echo "Removing previous container..."
          ssh "lifeos@$DEPLOY_HOST" \
            "sudo docker rm -f lifeos-backend 2>/dev/null || true"

          echo "Starting new container..."
          ssh "lifeos@$DEPLOY_HOST" "
            sudo docker run -d \
              --name lifeos-backend \
              --restart unless-stopped \
              --env-file /opt/lifeos/shared/.env \
              -p 127.0.0.1:4000:4000 \
              '$IMAGE'
          "

          echo "Waiting for backend health..."

          for i in {1..30}; do
            if ssh "lifeos@$DEPLOY_HOST" \
              "curl -fsS http://127.0.0.1:4000/api/health >/dev/null 2>&1"; then
              echo "Backend is healthy!"
              exit 0
            fi

            echo "Health check attempt $i/30..."
            sleep 2
          done

          echo "Backend health check failed."

          echo "Container status:"
          ssh "lifeos@$DEPLOY_HOST" \
            "sudo docker ps -a --filter name=lifeos-backend"

          echo "Container logs:"
          ssh "lifeos@$DEPLOY_HOST" \
            "sudo docker logs --tail 100 lifeos-backend || true"

          exit 1
